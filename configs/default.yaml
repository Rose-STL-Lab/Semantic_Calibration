# Loaded first, then judge.yaml, models/<model>, methods/<method>,
# datasets/<dataset>, then any --set overrides.

# one seed for python/numpy/torch RNGs, shuffling, LoRA init, GRPO and rollout sampling
seed: 42

# Both are repo-relative unless absolute. The HuggingFace cache is NOT set here:
# export HF_HOME yourself, as with CUDA_VISIBLE_DEVICES and OPENAI_API_KEY.
paths:
  ckpt: ckpt                 # training checkpoints
  results: results           # results/<exp_name>/{config.yaml,results.json,results.csv}
