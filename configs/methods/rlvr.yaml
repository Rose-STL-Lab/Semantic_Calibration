method:
  name: RLVR
  system_prompt: |-
    Provide a concise and direct answer to the question. Avoid unnecessary explanations or additional text.

  train:
    reward: correctness            # binary correctness only, no calibration term
    corr_w: 1.0
    max_seq_length: 1024
    max_prompt_length: 256
    learning_rate: 5.0e-6
    beta: 0.01
    loss_type: grpo
    adam_beta1: 0.9
    adam_beta2: 0.99
    weight_decay: 0.1
    warmup_ratio: 0.1
    lr_scheduler_type: cosine
    optim: paged_adamw_8bit
    # TRL counts completions, not prompts: 8 x 4 = 32 completions = 4 prompts/step
    per_device_train_batch_size: 8
    gradient_accumulation_steps: 4
    num_generations: 8
    temperature: 0.7
    top_p: 0.95
    num_train_epochs: 1
    max_steps: -1
    save_steps: 250
    max_grad_norm: 0.1
    logging_steps: 1
    # Mid-training validation on the eval split, at the same K as the final
    # eval below. Set eval_every_steps to 0 to turn it off, or pass
    # --set method.train.eval_num_rollouts=8 to make each pass ~4x cheaper
    # when the rows are only being read for their trend; checkpoints are saved
    # every save_steps either way and can be scored afterwards with
    # evaluation/eval_semantic.py.
    eval_every_steps: 250          # 0.1 epoch (2500 steps); 0, or more steps than the run, turns it off
    eval_num_rollouts: 16
    eval_max_new_tokens: 256
    eval_temperature: 0.7
    eval_top_p: 0.95
    eval_size: 1000

  eval:
    num_rollouts: 16
    temperature: 0.7
    top_p: 0.95
    max_new_tokens: 256
    max_seq_length: 1024
    ece_bins: 10
    # clustering: one equivalence call per unordered pair, same protocol as CSR
