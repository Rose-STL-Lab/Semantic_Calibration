# RLCR (Damani et al., 2025): GRPO with format + exact-match + Brier rewards on
# an explicit <think>/<answer>/<analysis>/<confidence> interface.
# Unsloth/GRPO port of the published recipe; rewards and weights match upstream.
method:
  name: RLCR
  kind: verbalized
  trainable: true
  system_prompt: |-
    A conversation between User and Assistant. The user asks a question, and the Assistant solves it. The assistant first thinks about the reasoning process in the mind, provides the user with the final answer, then analyzes its confidence about the solution and then provides the user with its confidence level. The confidence level is a number between 0 and 1 (inclusive) enclosed within <confidence> </confidence> tags. The final answer is enclosed between <answer> </answer> tags.The analysis about confidence and uncertainty is enclosed within <analysis> </analysis> tags. The assistant should reason about its confidence in the solution and its uncertainty in the solution within these tags.Here are some guidelines for the analysis: 1. Your task is to point out things where the model could be wrong in its thinking, or things where there might be ambiguity in the solution steps, or in the reasoning process itself.
    2. You should not suggest ways of fixing the response, your job is only to reason about uncertainties.
    3. For some questions, the response might be correct. In these cases, It is also okay to have only a small number of uncertainties and then explictly say that I am unable to spot more uncertainties.
    4. Uncertainties might be different from errors. For example, uncertainties may arise from ambiguities in the question, or from the application of a particular lemma/proof. 
    5. If there are alternate potential approaches that may lead to different answers, you should mention them.
    6. List out plausible uncertainties, do not make generic statements, be as specific about uncertainties as possible.
    7. Enclose this uncertainty analysis within <analysis> </analysis> tags.
    The final format that must be followed is : <think> reasoning process here </think><answer> final answer here </answer> <analysis> analysis about confidence and uncertainty here</analysis> <confidence> confidence level here (number between 0 and 1) </confidence>

  # RLCR wraps the question, it does not pass it bare.
  user_template: "\n\nPROBLEM: {question}\n\n"

  confidence:
    style: rlcr               # <confidence>0.83</confidence>
    scale: 1.0

  train:
    algorithm: grpo
    format_pattern: tabc      # think/answer/analysis/confidence
    # [format, accuracy, brier, mean_confidence, confidence_one_or_zero]
    reward_weights: [0.5, 0.5, 0.5, 0.000001, 0.000001]
    max_seq_length: 4096
    max_prompt_length: 3072
    max_completion_length: 1536
    learning_rate: 1.0e-6
    beta: 0.0
    loss_type: grpo           # upstream leaves this at TRL's bnpo default
    adam_beta1: 0.9
    adam_beta2: 0.99
    weight_decay: 0.0
    warmup_ratio: 0.05
    lr_scheduler_type: constant_with_warmup
    optim: paged_adamw_8bit
    # TRL counts completions, not prompts: 8 x 4 = 32 completions = 4 prompts/step
    per_device_train_batch_size: 8
    gradient_accumulation_steps: 4
    num_generations: 8
    num_iterations: 1
    num_train_epochs: 1
    max_steps: -1
    save_steps: 250
    save_total_limit: 10
    max_grad_norm: 1.0
    logging_steps: 5
    eval_every_steps: 1000
    eval_size: 1000
    eval_temperature: 0.0
    eval_top_p: 1.0
    eval_max_new_tokens: 1536
    temperature: 0.7
    top_p: 1.0                # upstream sets none, so TRL's default
    scale_rewards: false      # RLCR-specific; the CSR/RLVR lanes scale
    use_vllm: true
    vllm_gpu_memory_utilization: 0.4
    gpu_memory_utilization: 0.5

  eval:
    temperature: 0.0
    top_p: 1.0
    max_new_tokens: 1536
    max_seq_length: 4096
    ece_bins: 10
