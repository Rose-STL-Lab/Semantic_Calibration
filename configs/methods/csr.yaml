# CSR = RLVR's correctness reward + a semantic calibration reward whose weight
# runs from cali_w_start to cali_w_end under cali_w_schedule (constant when equal).
# Answer-only: no chain-of-thought, no verbalized confidence token.
method:
  name: CSR
  system_prompt: |-
    Provide a concise and direct answer to the question. Avoid unnecessary explanations or additional text.

  train:
    reward: calibration_correctness
    corr_w: 1.0                    # weight on the binary correctness reward
    cali_w_start: 0.8              # calibration weight, ramped 0.8 -> 1.2
    cali_w_end: 1.2
    cali_w_schedule: sigmoid       # linear | sigmoid (equal endpoints = constant)
    # Both rewards are on [0, 1]. Much larger calibration weights fragment the
    # policy or collapse it onto one answer. TRL's default scale_rewards='group' applies.
    max_seq_length: 1024
    max_prompt_length: 256
    learning_rate: 5.0e-6
    beta: 0.01
    loss_type: grpo
    adam_beta1: 0.9
    adam_beta2: 0.99
    weight_decay: 0.1
    warmup_ratio: 0.1
    lr_scheduler_type: cosine
    optim: paged_adamw_8bit
    # TRL counts completions, not prompts: 8 x 4 = 32 completions = 4 prompts/step,
    # so one epoch over 10k prompts is 2500 steps
    per_device_train_batch_size: 8
    gradient_accumulation_steps: 4
    num_generations: 8
    temperature: 0.7
    top_p: 0.95
    num_train_epochs: 1
    max_steps: -1
    save_steps: 250
    max_grad_norm: 0.1
    logging_steps: 1
    # Mid-training validation on the eval split, at the same K as the final eval.
    # Each pass costs eval_size x (K + K(K-1)/2) judge calls; lower eval_num_rollouts
    # to make it cheaper.
    eval_every_steps: 250          # 0.1 epoch (2500 steps); 0, or more steps than the run, turns it off
    eval_num_rollouts: 16
    eval_max_new_tokens: 256
    eval_temperature: 0.7
    eval_top_p: 0.95
    eval_size: 1000

  eval:
    num_rollouts: 16
    temperature: 0.7
    top_p: 0.95
    max_new_tokens: 256
    max_seq_length: 1024
    ece_bins: 10
    # clustering: one symmetric equivalence call per unordered pair (120 at K=16),
    # the same protocol CSR trains against
