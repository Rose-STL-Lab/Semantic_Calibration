# LLM judge: equivalence between two rollouts, and correctness against the gold answer.
# The hosted judge reads OPENAI_API_KEY from the env (+ OPENAI_API_VERSION and
# OPENAI_AZURE_ENDPOINT for Azure); api_key below is only for a base_url server.

judge:
  # Correctness is always judged by the model below. `equivalence: f1` replaces only
  # the rollout-vs-rollout equivalence call with token F1 (csr/f1_judge.py) -- the
  # CSR-F1 configuration. --set judge.equivalence=f1
  equivalence: llm
  f1_threshold: 0.5          # reported taus: 0.50 Llama/Mistral, 0.80 Qwen

  model_id: gpt-4.1-nano
  temperature: 0.0
  max_tokens: 16             # the prompts answer with one word
  max_retries: 2             # passes over unreadable replies; also retries per failed request
  sleep_sec: 1.5
  # the SDK default (600 s) lets one stalled request hold up a batch
  request_timeout_sec: 20
  client_max_retries: 1
  # null = the hosted OpenAI endpoint. For a local server instead, e.g.
  # scripts/serve/serve_judge.sh 0 8310 openai/gpt-oss-20b:
  #   --set judge.base_url=http://127.0.0.1:8310/v1 --set judge.model_id=gpt-oss-20b
  #   --set judge.reasoning_effort=low --set judge.max_tokens=1024
  base_url: null
  api_key: null
  reasoning_effort: null     # only reasoning models take it; gpt-oss-20b wants "low"
  max_workers: 32
  batch_size: 128
  cache_max_size: 200000

  system_prompt: "You are a helpful assistant that helps people find information."

  # rollout-vs-rollout equivalence, and correctness against a single gold answer
  # (every question of correctness_prompt: judge datasets)
  judge_prompt: |-
    Given a question and two potential answers, you need to analyze whether the two answers convey the same meaning. Respond with "yes" or "no".
    Your response should be completely based on the similarity between the two answers.
    DO NOT use your own knowledge base when do the comparison.

    Question:
    {q}
    Response 1:
    {a}
    Response 2:
    {b}

    Your response should use the following format:
    Correct: <yes or no>

  # Correctness on datasets with correctness_prompt: gold (TriviaQA, NQ-Open, MSMARCO)
  # when the question has several gold answers; one gold uses judge_prompt. Directional:
  # {a} is the candidate, {b} the reference answers joined by "; ".
  multi_gold_prompt: |-
    Given a question, one generated answer, and a list of candidate correct answers, you need to analyze whether the generated answer matches any candidate correct answer. Respond with "yes" or "no".
    Your response should be completely based on the similarity between the generated answer and the candidate correct answers.
    DO NOT use your own knowledge base when do the comparison.

    Question:
    {q}
    Generated Answer:
    {a}
    Candidate Correct Answers:
    {b}

    Your response should use the following format:
    Correct: <yes or no>
