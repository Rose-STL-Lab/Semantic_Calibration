model:
  name: qwen32b

  # backbone tag in run names (and ckpt/<METHOD>/<ckpt_name>/ without --exp-name)
  ckpt_name: qwen32b

  # Same recipe as qwen14b.yaml. The plain bnb-4bit build, since unsloth's vLLM path
  # does not support the dynamic-quant 32B; use the same build for training and eval.
  hf_id: unsloth/Qwen3-32B-bnb-4bit
  use_exact_model_name: false

  chat_end_markers:
    - "<|im_end|>"
    - "<|endoftext|>"

  verbalized_separators: [",", ";", ":", ".", "\n"]

  # thinking off, as in qwen14b.yaml
  chat_template_kwargs:
    enable_thinking: false

  load_in_4bit: true
  # vLLM's share of the card; ~19 GB of 4-bit weights
  gpu_memory_utilization: 0.4

  lora:
    rank: 32
    random_state: 3407
    alpha: 32
    dropout: 0.0
    target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
