dataset:
  name: musique

  # multi-hop with supporting paragraphs, like hotpot_context but 2-4 hops and
  # ~20 paragraphs; the records also carry an `answerable` flag
  hf:
    path: dgslibisey/MuSiQue
  train_split: train
  eval_split: validation
  train_size: 10000
  eval_size: 1000
  correctness_prompt: judge

  system_prompt:
    default: |-
      Provide a concise and direct answer to the question. Use the provided context and reason step-by-step. End with 'Final answer: <answer>'.

# measured on the full 1000-question eval split: 2538 median, 5370 max. 20 paragraphs
# against hotpot_context's 10, so it needs a wider window than the other sets.
model:
  gpu_memory_utilization: 0.35

method:
  train:
    max_prompt_length: 5632
    max_seq_length: 6144
  eval:
    max_seq_length: 6144
