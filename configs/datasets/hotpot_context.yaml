dataset:
  name: hotpot_context
  display_name: HotpotQA (with context)
  role: in-distribution          # trained on; also the ID evaluation set

  # same split as `hotpot`; only the prompt differs -- it carries the distractor paragraphs
  hf:
    path: hotpot_qa
    config: distractor
  train_split: train
  eval_split: validation
  train_size: 10000
  eval_size: 1000
  correctness_prompt: judge

  # prepend each paragraph as "Title: <t>\n<sentences>", blank-line separated, then "Question: <q>"
  include_context: true

  # answer-only methods (Base, RLVR, CSR) only; RD and RLCR keep their own format instructions
  system_prompt:
    default: |-
      Provide a concise and direct answer to the question. Use the provided context and reason step-by-step. End with 'Final answer: <answer>'.

  # the answer is whatever follows the last marker; RD and RLCR have their own parsers
  answer_marker: "Final answer:"

# The distractor context makes the prompt ~1500 tokens; the 1024-token default cannot hold it.
model:
  gpu_memory_utilization: 0.35   # vLLM's share of the card; longer sequences need more room

method:
  train:
    max_prompt_length: 3072
    max_seq_length: 4096
  eval:
    max_seq_length: 4096
