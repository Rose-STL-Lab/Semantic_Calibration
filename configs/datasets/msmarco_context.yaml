dataset:
  name: msmarco_context

  # same queries and golds as `msmarco`, with the passages that dataset ships.
  # Pairing the two isolates the effect of context from the effect of domain shift.
  hf:
    path: microsoft/ms_marco
    config: v1.1
  train_split: train
  eval_split: validation
  train_size: 10000
  eval_size: 1000
  correctness_prompt: gold

  system_prompt:
    default: |-
      Provide a concise and direct answer to the question. Use the provided context and reason step-by-step. End with 'Final answer: <answer>'.

# measured: 913 tokens median, 1465 max
model:
  gpu_memory_utilization: 0.35

method:
  train:
    max_prompt_length: 3072
    max_seq_length: 4096
  eval:
    max_seq_length: 4096
