dataset:
  name: 2wiki

  # 2WikiMultihopQA in HotpotQA's own layout: 10 paragraphs, one short answer.
  # Restricted to the two compositional reasoning types; see keep_types below.
  hf:
    path: scholarly-shadows-syndicate/2wikimultihopqa_with_q_gpt35
  # evaluation only: most eval question templates also occur in the train split
  train_split: validation
  eval_split: validation
  eval_size: 1000
  correctness_prompt: judge

  # comparison and bridge_comparison are answerable from the question alone
  # (yes/no, or one of the two named entities), so they are dropped
  keep_types: [compositional, inference]

  system_prompt:
    default: |-
      Provide a concise and direct answer to the question. Use the provided context and reason step-by-step. End with 'Final answer: <answer>'.

model:
  gpu_memory_utilization: 0.35

method:
  train:
    max_prompt_length: 4608
    max_seq_length: 5120
  eval:
    max_seq_length: 5120
