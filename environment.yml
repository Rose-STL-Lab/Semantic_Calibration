# Environment for CSR, RLVR and RLCR training and for all evaluation.
#
#   conda env create -f environment.yml
#   conda activate csr
#
# Pinned to the versions the reported results were produced with.  The stack is
# version-sensitive: unsloth patches TRL at import time, and TRL 0.24 counts
# completions rather than prompts in its generation batch, so older or newer
# combinations change the effective batch size.
